name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Check repository contents and documentation links
        run: python tools/check_repository.py
  research:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research and test dependencies
        run: python -m pip install -e ".[dev,research]"
      - name: Run offline tests including research calculations
        run: python -m pytest -q -p no:cacheprovider
