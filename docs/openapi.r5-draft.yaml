            "description": "本接口受控代码；decision_stopped 是未单独公开的内部停止原因，不表示可重试或可投递。"
          },
          "required_action": {
            "type": "string",
            "enum": [
              "confirm",
              "report_discomfort",
              "none"
            ],
            "description": "confirm 表示确认流程待用户主动处理，包含发起、展示或回答；不授权自动弹问。report_discomfort 表示显示安全提示或重新报告，none 不代表身体安全。"
          },
