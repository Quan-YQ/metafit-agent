                "type": [
                  "number",
                  "null"
                ],
                "description": "仅检查有限数值，不表示已确认量表或科学阈值。"
              },
              "extensions": {
                "type": [
                  "object",
                  "null"
                ],
                "description": "JSON 对象或 null；最多 16384 UTF-8 字节、深度 8、遍历节点 1000；指标扩展同样受限。"
              },
              "discomfort": {
                "type": [
                  "object",
                  "null"
                ],
                "properties": {
                  "status": {
                    "enum": [
