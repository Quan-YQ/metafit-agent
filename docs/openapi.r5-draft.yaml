            "description": "提交与查询均采用同一查询记录语义；decided 只表示历史决策记录存在，不表示反馈已投递或当前安全。pending 包括预占及安全检查未完成；null 表示不可获得。"
          },
          "event_status": {
            "type": [
              "string",
              "null"
            ],
