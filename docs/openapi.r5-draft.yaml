                    "confidence": {
                      "type": [
                        "number",
                        "null"
                      ],
                      "minimum": 0,
                      "maximum": 1
                    },
                    "quality": {
                      "type": [
                        "string",
                        "null"
                      ]
                    },
                    "extensions": {
                      "type": [
                        "object",
                        "null"
                      ]
                    }
                  },
                  "required": [
                    "metric_id",
                    "value",
                    "unit",
                    "source",
                    "observation_id"
                  ]
                },
                "description": "观测 ID 在事件内不得重复；数值和单位不构成科学有效性证明。"
              }
            },
            "additionalProperties": false,
            "description": "必须通过 R1 完整验证，包括时间、观测 ID 唯一性及扩展大小和深度；不适优先于非安全输入错误。"
