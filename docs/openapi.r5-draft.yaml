              "event_id",
              "event_type",
              "user_id",
              "session_id",
              "set_id",
              "exercise_id",
              "timestamp",
              "source"
            ],
            "properties": {
              "schema_version": {
                "const": "0.1"
              },
              "event_id": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,64}$"
              },
              "event_type": {
                "const": "set_completed"
              },
              "user_id": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,64}$"
              },
              "session_id": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,64}$"
              },
              "set_id": {
                "type": "string"
              },
              "exercise_id": {
                "type": "string"
              },
              "timestamp": {
                "type": "string",
                "format": "date-time",
                "description": "必须含已知时区，小数秒最多 6 位，不允许 -00:00；R1 还检查实际日期有效性。"
              },
              "source": {
                "const": "simulation"
              },
              "set_index": {
                "type": [
                  "integer",
